{% extends 'adminbase.html' %}
{% block admin %}

<div class="container-fluid px-0 mb-5 pb-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold text-slate-900 mb-1">Security & Password</h3>
      <p class="text-muted small mb-0">Change your master administrator access credentials</p>
    </div>
    <a href="{% url 'admindash' %}" class="btn btn-outline-secondary rounded-pill px-4 fw-semibold">
      <i class="ti ti-arrow-left me-1"></i> Back to Dashboard
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="auth-icon-badge mx-auto mb-3" style="background: linear-gradient(135deg, #0f172a, #064e3b);">
            <i class="ti ti-shield-lock fs-2 text-white"></i>
          </div>
          <h4 class="fw-bold text-slate-900 mb-1">Update Master Password</h4>
          <p class="text-muted small">Choose a strong, complex password to keep the admin portal secure</p>
        </div>

        <form action="{% url 'adminchangepwd' %}" method="POST" class="row g-4">
          {% csrf_token %}

          <div class="col-12">
            <label for="current-password" class="form-label fw-semibold text-slate-700">Current Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="ti ti-key"></i></span>
              <input type="password" class="form-control form-control-lg bg-light border-start-0 fs-6" id="current-password" name="oldpwd" placeholder="Enter current master password" required autocomplete="current-password" />
            </div>
          </div>

          <div class="col-12">
            <label for="new-password" class="form-label fw-semibold text-slate-700">New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="ti ti-lock"></i></span>
              <input type="password" class="form-control form-control-lg bg-light border-start-0 fs-6" id="new-password" name="newpwd" placeholder="Enter new strong password" required autocomplete="new-password" />
            </div>
          </div>

          <div class="col-12">
            <label for="confirm-password" class="form-label fw-semibold text-slate-700">Confirm New Password <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="ti ti-lock-check"></i></span>
              <input type="password" class="form-control form-control-lg bg-light border-start-0 fs-6" id="confirm-password" name="confirmpwd" placeholder="Re-enter new password" required autocomplete="new-password" />
            </div>
          </div>

          <div class="col-12 mt-4 pt-3 border-top">
            <button type="submit" class="btn btn-success btn-lg rounded-pill w-100 fw-bold shadow-sm py-3">
              <i class="ti ti-device-floppy me-1"></i> Update Admin Password
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
