{% extends 'base.html' %}
{% load static %}

{% block title %}User Login - Book Walla{% endblock %}

{% block main %}

<div class="auth-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="auth-card p-4 p-sm-5">
          <!-- Auth Header -->
          <div class="auth-header">
            <div class="auth-icon-badge">
              <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>
            <h2 class="fw-bold text-slate-900 mb-1">Welcome Back</h2>
            <p class="text-muted small">Sign in to access your cart, order history, and wishlist</p>
          </div>

          <!-- Login Form -->
          <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold text-slate-700">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                <input type="email" name="username" class="form-control form-control-lg bg-light border-start-0 fs-6" id="email" placeholder="you@example.com" required autocomplete="username">
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label fw-semibold text-slate-700 mb-0">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control form-control-lg bg-light border-start-0 fs-6" id="password" placeholder="Enter your secret password" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn-primary-gradient mb-3">
              <i class="fa-solid fa-right-to-bracket me-2"></i> Log In to Account
            </button>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="text-muted small mb-2">
                Don't have an account yet? 
                <a href="{% url 'register' %}" class="fw-bold text-success text-decoration-none">Create an Account</a>
              </p>
              <p class="text-muted small mb-0">
                <a href="{% url 'index' %}" class="text-muted text-decoration-none">
                  <i class="fa-solid fa-arrow-left me-1"></i> Back to Bookstore
                </a>
              </p>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

{% endblock main %}
