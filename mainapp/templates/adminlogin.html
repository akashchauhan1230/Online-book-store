{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - Secure Gateway | Book Walla</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Bootstrap CSS -->
  <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

  <style>
    :root {
      --primary-500: #10b981;
      --primary-600: #059669;
      --primary-400: #34d399;
      --slate-900: #090d16;
      --slate-800: #111827;
      --slate-700: #1f2937;
      --slate-400: #9ca3af;
      --slate-300: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--slate-900);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.16) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(6, 78, 59, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, #060911 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #ffffff;
      position: relative;
    }

    /* Ambient background grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    .admin-auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .admin-card {
      background: rgba(17, 24, 39, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 24px;
      padding: 2.25rem 2rem 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65),
                  0 0 30px rgba(16, 185, 129, 0.12);
      position: relative;
      overflow: hidden;
    }

    .admin-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #10b981, #34d399, #059669);
    }

    /* Glowing Badge Icon */
    .admin-icon-shield {
      width: 62px;
      height: 62px;
      margin: 0 auto 1rem;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(6, 78, 59, 0.4));
      border: 1.5px solid rgba(52, 211, 153, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: var(--primary-400);
      box-shadow: 0 8px 20px -5px rgba(16, 185, 129, 0.3);
      transition: transform 0.3s ease;
    }

    .admin-icon-shield:hover {
      transform: scale(1.05) rotate(3deg);
    }

    .admin-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, #d1fae5);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.2rem;
      text-align: center;
    }

    .admin-subtitle {
      color: var(--slate-400);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* Custom Form Controls */
    .form-group-custom {
      margin-bottom: 1.25rem;
    }

    .form-label-custom {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--slate-300);
      margin-bottom: 0.45rem;
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 1rem;
      color: var(--primary-400);
      font-size: 1rem;
      pointer-events: none;
      z-index: 2;
    }

    .form-control-admin {
      width: 100%;
      padding: 0.8rem 1.15rem 0.8rem 2.8rem;
      background: rgba(15, 23, 42, 0.65);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.92rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .form-control-admin::placeholder {
      color: rgba(156, 163, 175, 0.45);
    }

    .form-control-admin:focus {
      outline: none;
      background: rgba(15, 23, 42, 0.9);
      border-color: var(--primary-400);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 1rem;
      background: none;
      border: none;
      color: var(--slate-400);
      cursor: pointer;
      font-size: 0.95rem;
      transition: color 0.2s;
      z-index: 2;
    }

    .toggle-pwd-btn:hover {
      color: #ffffff;
    }

    /* Submit Button */
    .btn-admin-submit {
      width: 100%;
      padding: 0.85rem 1.25rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 8px 18px -4px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
      margin-top: 0.75rem;
    }

    .btn-admin-submit:hover {
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -4px rgba(16, 185, 129, 0.5);
      color: #ffffff;
    }

    /* Alert Styling */
    .admin-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      font-size: 0.82rem;
      color: #fca5a5;
      margin-bottom: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Security Footer */
    .security-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1.5rem;
      padding-top: 1.15rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      color: var(--slate-400);
    }

    .security-footer a {
      color: var(--primary-400);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.2s;
    }

    .security-footer a:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="admin-auth-container">
    <div class="admin-card">
      
      <!-- Icon Header -->
      <div class="admin-icon-shield">
        <i class="fa-solid fa-shield-halved"></i>
      </div>

      <h1 class="admin-title">Admin Gateway</h1>
      <p class="admin-subtitle">Authorized personnel only &bull; Book Walla HQ</p>

      <!-- Django Flash Messages -->
      {% if messages %}
        {% for m in messages %}
          <div class="admin-alert" role="alert">
            <div class="d-flex align-items-center gap-2">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <span>{{ m }}</span>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.7rem;"></button>
          </div>
        {% endfor %}
      {% endif %}

      <!-- Login Form -->
      <form method="post" autocomplete="on">
        {% csrf_token %}

        <!-- Username -->
        <div class="form-group-custom">
          <label for="username" class="form-label-custom">Administrator Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user-shield input-icon-left"></i>
            <input 
              type="text" 
              name="username" 
              class="form-control-admin" 
              id="username" 
              placeholder="Enter administrator ID" 
              required 
              autofocus 
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Password -->
        <div class="form-group-custom">
          <label for="password" class="form-label-custom">Master Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input 
              type="password" 
              name="password" 
              class="form-control-admin" 
              id="password" 
              placeholder="Enter master password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="toggle-pwd-btn" id="togglePwd" title="Toggle password visibility">
              <i class="fa-regular fa-eye" id="pwdEyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-admin-submit">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span>Authenticate & Enter</span>
        </button>
      </form>

      <!-- Security Meta & Back to Home -->
      <div class="security-footer">
        <span title="Encrypted Connection">
          <i class="fa-solid fa-lock text-success me-1"></i> Secure Session
        </span>
        <a href="{% url 'index' %}">
          <i class="fa-solid fa-arrow-left"></i> Back to Store
        </a>
      </div>

    </div>
  </div>

  <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePwd');
    const pwdInput = document.getElementById('password');
    const pwdEyeIcon = document.getElementById('pwdEyeIcon');

    if (toggleBtn && pwdInput && pwdEyeIcon) {
      toggleBtn.addEventListener('click', function () {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        pwdEyeIcon.classList.toggle('fa-eye', !isPassword);
        pwdEyeIcon.classList.toggle('fa-eye-slash', isPassword);
      });
    }
  </script>
</body>

</html>
